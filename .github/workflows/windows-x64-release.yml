name: Windows x64 Release

on:
  push:
    branches:
      - main
      - "wip/**"
    paths:
      - ".github/workflows/windows-x64-release.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/windows-x64-release.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "1"
  CL_MPCount: "1"
  PYTHONUTF8: "1"

jobs:
  windows-x64-release:
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.11 x64
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          architecture: x64

      - name: Show toolchain
        shell: pwsh
        run: >-
          ./scripts/ci-windows-release.ps1
          -Phase ShowToolchain
          -BuildDirectory build-ci
          -ArtifactDirectory ci-artifacts/DAWHermes-Windows-x64-Release
          -LogDirectory ci-logs
          -ParallelJobs 1
          -ResetDirectories

      - name: Configure Release x64
        shell: pwsh
        run: >-
          ./scripts/ci-windows-release.ps1
          -Phase Configure
          -BuildDirectory build-ci
          -ArtifactDirectory ci-artifacts/DAWHermes-Windows-x64-Release
          -LogDirectory ci-logs
          -ParallelJobs 1

      - name: Verify LTCG cache
        shell: pwsh
        run: >-
          ./scripts/ci-windows-release.ps1
          -Phase VerifyCache
          -BuildDirectory build-ci
          -ArtifactDirectory ci-artifacts/DAWHermes-Windows-x64-Release
          -LogDirectory ci-logs
          -ParallelJobs 1

      - name: Build Release tests
        shell: pwsh
        run: >-
          ./scripts/ci-windows-release.ps1
          -Phase BuildTests
          -BuildDirectory build-ci
          -ArtifactDirectory ci-artifacts/DAWHermes-Windows-x64-Release
          -LogDirectory ci-logs
          -ParallelJobs 1

      - name: Run deterministic tests
        shell: pwsh
        run: >-
          ./scripts/ci-windows-release.ps1
          -Phase RunTests
          -BuildDirectory build-ci
          -ArtifactDirectory ci-artifacts/DAWHermes-Windows-x64-Release
          -LogDirectory ci-logs
          -ParallelJobs 1

      - name: Build Release application
        shell: pwsh
        run: >-
          ./scripts/ci-windows-release.ps1
          -Phase BuildApplication
          -BuildDirectory build-ci
          -ArtifactDirectory ci-artifacts/DAWHermes-Windows-x64-Release
          -LogDirectory ci-logs
          -ParallelJobs 1

      - name: Verify Release flags
        shell: pwsh
        run: >-
          ./scripts/ci-windows-release.ps1
          -Phase VerifyFlags
          -BuildDirectory build-ci
          -ArtifactDirectory ci-artifacts/DAWHermes-Windows-x64-Release
          -LogDirectory ci-logs
          -ParallelJobs 1

      - name: Verify x64 executable
        shell: pwsh
        run: >-
          ./scripts/ci-windows-release.ps1
          -Phase VerifyX64
          -BuildDirectory build-ci
          -ArtifactDirectory ci-artifacts/DAWHermes-Windows-x64-Release
          -LogDirectory ci-logs
          -ParallelJobs 1

      - name: Package artifact
        shell: pwsh
        run: >-
          ./scripts/ci-windows-release.ps1
          -Phase Package
          -BuildDirectory build-ci
          -ArtifactDirectory ci-artifacts/DAWHermes-Windows-x64-Release
          -LogDirectory ci-logs
          -ParallelJobs 1

      - name: Verify package
        shell: pwsh
        run: >-
          ./scripts/ci-windows-release.ps1
          -Phase VerifyPackage
          -BuildDirectory build-ci
          -ArtifactDirectory ci-artifacts/DAWHermes-Windows-x64-Release
          -LogDirectory ci-logs
          -ParallelJobs 1

      - name: Write workflow summary
        if: always()
        shell: pwsh
        run: >-
          ./scripts/ci-windows-release.ps1
          -Phase Summary
          -BuildDirectory build-ci
          -ArtifactDirectory ci-artifacts/DAWHermes-Windows-x64-Release
          -LogDirectory ci-logs
          -ParallelJobs 1

      - name: Upload runtime artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: DAWHermes-Windows-x64-Release-${{ github.sha }}
          path: ci-artifacts/DAWHermes-Windows-x64-Release/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: DAWHermes-Windows-x64-Logs-${{ github.sha }}
          path: ci-logs/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
